<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --bg-side: #f7f7f8;
    --bubble-user: #eef0ff;
    --bubble-bot: #f5f5f6;
    --ink: #1d1d1f;
    --ink-soft: #6e6e76;
    --rule: #e6e6e9;
    --accent: #4b4ddb;
    --accent-soft: #eceeff;
    --danger: #b42318;
    --danger-bg: #fdecea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1b1e;
      --bg-side: #141416;
      --bubble-user: #2b2c55;
      --bubble-bot: #28282b;
      --ink: #ededf0;
      --ink-soft: #9a9aa2;
      --rule: #2e2e33;
      --accent: #7879e8;
      --accent-soft: #23234a;
      --danger: #ff8a80;
      --danger-bg: #3a1f1d;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--ink);
    overflow: hidden;
  }
  .shell { display: flex; height: 100vh; height: 100dvh; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 260px;
    flex-shrink: 0;
    background: var(--bg-side);
    border-right: 1px solid var(--rule);
    display: flex;
    flex-direction: column;
    padding: 14px 12px;
  }
  .brand {
    display: flex; align-items: center; gap: 9px;
    padding: 6px 8px 16px;
    font-weight: 700; font-size: 15px;
  }
  .brand-mark {
    width: 26px; height: 26px; border-radius: 7px;
    background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700;
  }
  .new-chat {
    border: 1px solid var(--rule);
    border-radius: 9px;
    padding: 9px 12px;
    font: inherit; font-size: 13.5px;
    color: var(--ink);
    background: var(--bg);
    cursor: pointer;
    text-align: left;
    margin-bottom: 18px;
  }
  .new-chat:hover { background: var(--accent-soft); }
  .sidebar-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--ink-soft);
    padding: 0 8px 8px;
  }
  .notes-card {
    border: 1px solid var(--rule);
    border-radius: 10px;
    background: var(--bg);
    padding: 12px;
  }
  .notes-title { font-size: 13.5px; font-weight: 600; word-break: break-word; }
  .notes-meta { font-size: 12px; color: var(--ink-soft); margin: 4px 0 10px; }
  .notes-actions { display: flex; gap: 8px; }
  .small-btn {
    font: inherit; font-size: 12.5px;
    border: 1px solid var(--rule);
    background: var(--bg);
    color: var(--ink);
    border-radius: 7px;
    padding: 6px 10px;
    cursor: pointer;
  }
  .small-btn:hover { background: var(--accent-soft); }
  .small-btn.danger { color: var(--danger); }
  .sidebar-footer {
    margin-top: auto;
    padding: 10px 8px 0;
    border-top: 1px solid var(--rule);
    font-size: 12px;
    color: var(--ink-soft);
  }

  /* ---------- Main ---------- */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 24px;
    border-bottom: 1px solid var(--rule);
    font-size: 13.5px;
  }
  .model-pill { display: flex; align-items: center; gap: 7px; font-weight: 600; }
  .model-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: #3fb950; }
  .notes-status { color: var(--ink-soft); font-size: 12.5px; }
  .notes-status.on { color: var(--accent); font-weight: 500; }

  .thread { flex: 1; overflow-y: auto; padding: 28px 0 10px; }
  .thread-inner { max-width: 700px; margin: 0 auto; padding: 0 24px; }
  .msg { display: flex; gap: 12px; margin-bottom: 20px; align-items: flex-start; }
  .msg.user { flex-direction: row-reverse; }
  .msg-avatar {
    width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; color: #fff;
  }
  .msg-avatar.bot { background: var(--accent); }
  .msg-avatar.user { background: var(--ink-soft); }
  .bubble {
    max-width: 80%;
    padding: 11px 15px;
    border-radius: 14px;
    font-size: 14.5px;
    line-height: 1.6;
    white-space: pre-wrap;      /* keeps the line breaks from the model's plain-text answers */
    word-break: break-word;
  }
  .msg.user .bubble { background: var(--bubble-user); border-top-right-radius: 4px; }
  .msg.bot .bubble { background: var(--bubble-bot); border-top-left-radius: 4px; }
  .bubble.error { background: var(--danger-bg); color: var(--danger); }

  .typing { display: flex; gap: 4px; padding: 6px 2px; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--ink-soft);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  /* ---------- Composer ---------- */
  .composer-wrap { padding: 10px 24px 18px; }
  .composer {
    max-width: 700px; margin: 0 auto;
    display: flex; align-items: flex-end; gap: 8px;
    border: 1px solid var(--rule);
    border-radius: 16px;
    background: var(--bg);
    padding: 10px;
  }
  .composer:focus-within { border-color: var(--accent); }
  .icon-btn, .send-btn {
    width: 36px; height: 36px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0; font-size: 16px;
  }
  .icon-btn { border: 1px solid var(--rule); background: var(--bg); color: var(--ink-soft); }
  .icon-btn:hover { background: var(--accent-soft); color: var(--accent); }
  .send-btn { border: none; background: var(--accent); color: #fff; }
  .send-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  textarea#composerInput {
    flex: 1; border: none; outline: none; resize: none;
    background: transparent; color: var(--ink);
    font-family: inherit; font-size: 14.5px; line-height: 1.5;
    max-height: 140px; padding: 8px 0;
  }
  textarea#composerInput::placeholder { color: var(--ink-soft); }
  .composer-hint {
    max-width: 700px; margin: 8px auto 0;
    text-align: center; font-size: 11.5px; color: var(--ink-soft);
  }

  @media (max-width: 760px) {
    .sidebar { display: none; }
    .topbar, .composer-wrap { padding-left: 14px; padding-right: 14px; }
    .thread-inner { padding: 0 14px; }
  }
</style>
</head>
<body>
<div class="shell">

  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">S</span> Study Assistant</div>
    <button class="new-chat" id="newChat">+ New chat</button>

    <div class="sidebar-label">Notes</div>
    <div class="notes-card">
      <div id="notesEmpty">
        <div class="notes-title">No notes loaded</div>
        <div class="notes-meta">Upload a .txt, .md or .pdf (max 5 MB).</div>
        <button class="small-btn" id="uploadBtn">Upload notes</button>
      </div>
      <div id="notesLoaded" hidden>
        <div class="notes-title" id="notesName"></div>
        <div class="notes-meta" id="notesMeta"></div>
        <div class="notes-actions">
          <button class="small-btn" id="replaceBtn">Replace</button>
          <button class="small-btn danger" id="removeBtn">Remove</button>
        </div>
      </div>
    </div>

    <div class="sidebar-footer">Practice project &middot; runs on your laptop</div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="model-pill"><span class="dot"></span> Study Assistant</div>
      <div class="notes-status" id="statusText">No notes loaded</div>
    </header>

    <div class="thread" id="thread">
      <div class="thread-inner" id="threadInner"></div>
    </div>

    <div class="composer-wrap">
      <div class="composer">
        <button class="icon-btn" id="attachBtn" title="Attach notes" aria-label="Attach notes">＋</button>
        <textarea id="composerInput" rows="1" placeholder="Ask about your notes…"></textarea>
        <button class="send-btn" id="sendBtn" aria-label="Send">➤</button>
      </div>
      <div class="composer-hint">Answers are generated by an AI model from your notes. Double-check anything important.</div>
      <input type="file" id="fileInput" accept=".txt,.md,.pdf" hidden>
    </div>
  </main>

</div>

<script>
  const $ = (id) => document.getElementById(id);
  const thread = $('thread');
  const inner = $('threadInner');
  const input = $('composerInput');
  const sendBtn = $('sendBtn');
  const fileInput = $('fileInput');
  const statusText = $('statusText');

  let busy = false;
  let notes = { filename: null, chars: 0, truncated: false };

  const WELCOME = 'Hi! Attach your lecture notes with the ＋ button (.txt, .md or .pdf), then ask me anything about them. You can also say "quiz me" for practice questions.';

  /* ---------- helpers ---------- */
  function scrollDown() { thread.scrollTop = thread.scrollHeight; }

  // textContent (not innerHTML) means model output can never inject HTML into the page.
  function addMessage(role, text, opts) {
    const row = document.createElement('div');
    row.className = 'msg ' + role;
    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar ' + role;
    avatar.textContent = role === 'user' ? 'U' : 'S';
    const bubble = document.createElement('div');
    bubble.className = 'bubble' + (opts && opts.error ? ' error' : '');
    bubble.textContent = text;
    row.append(avatar, bubble);
    inner.appendChild(row);
    scrollDown();
    return row;
  }

  function addTyping() {
    const row = document.createElement('div');
    row.className = 'msg bot';
    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar bot';
    avatar.textContent = 'S';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    row.append(avatar, bubble);
    inner.appendChild(row);
    scrollDown();
    return row;
  }

  function setBusy(value) {
    busy = value;
    sendBtn.disabled = value;
  }

  function autosize() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  }

  function renderNotes() {
    const loaded = !!notes.filename;
    $('notesEmpty').hidden = loaded;
    $('notesLoaded').hidden = !loaded;
    if (loaded) {
      $('notesName').textContent = notes.filename;
      $('notesMeta').textContent =
        notes.chars.toLocaleString() + ' characters' + (notes.truncated ? ' (long file, trimmed)' : '');
      statusText.textContent = notes.filename + ' loaded';
      statusText.classList.add('on');
    } else {
      statusText.textContent = 'No notes loaded';
      statusText.classList.remove('on');
    }
  }

  async function postJSON(url, body) {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {}),
    });
    let data = {};
    try { data = await res.json(); } catch (e) { /* response had no JSON body */ }
    return { ok: res.ok, data: data };
  }

  /* ---------- chat ---------- */
  async function send() {
    const text = input.value.trim();
    if (!text || busy) return;
    setBusy(true);
    addMessage('user', text);
    input.value = '';
    autosize();
    const typing = addTyping();
    try {
      const result = await postJSON('/api/chat', { message: text });
      typing.remove();
      if (result.ok) {
        addMessage('bot', result.data.answer);
      } else {
        addMessage('bot', result.data.error || 'Something went wrong.', { error: true });
      }
    } catch (e) {
      typing.remove();
      addMessage('bot', "Couldn't reach the server. Is app.py still running in your terminal?", { error: true });
    }
    setBusy(false);
    input.focus();
  }

  sendBtn.addEventListener('click', send);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  input.addEventListener('input', autosize);

  /* ---------- notes upload ---------- */
  function pickFile() { fileInput.click(); }
  $('attachBtn').addEventListener('click', pickFile);
  $('uploadBtn').addEventListener('click', pickFile);
  $('replaceBtn').addEventListener('click', pickFile);

  fileInput.addEventListener('change', async () => {
    const file = fileInput.files[0];
    if (!file) return;
    const form = new FormData();
    form.append('file', file);
    statusText.textContent = 'Reading ' + file.name + '…';
    try {
      const res = await fetch('/api/upload', { method: 'POST', body: form });
      let data = {};
      try { data = await res.json(); } catch (e) { /* no JSON body */ }
      if (res.ok) {
        notes = { filename: data.filename, chars: data.chars, truncated: data.truncated };
        renderNotes();
        inner.innerHTML = '';  // the server starts a fresh conversation for new notes
        addMessage('bot',
          'Loaded ' + data.filename + ' (' + data.chars.toLocaleString() + ' characters)' +
          (data.truncated ? '. It was long, so only the first part is being used' : '') +
          '. Ask me anything from it, or say "quiz me".');
      } else {
        renderNotes();  // put the status back to what it was
        addMessage('bot', data.error || 'Upload failed.', { error: true });
      }
    } catch (e) {
      renderNotes();
      addMessage('bot', "Couldn't reach the server. Is app.py still running in your terminal?", { error: true });
    }
    fileInput.value = '';  // lets you pick the same file again later
  });

  $('removeBtn').addEventListener('click', async () => {
    await postJSON('/api/notes/remove');
    notes = { filename: null, chars: 0, truncated: false };
    renderNotes();
    inner.innerHTML = '';
    addMessage('bot', 'Notes removed. ' + WELCOME);
  });

  $('newChat').addEventListener('click', async () => {
    await postJSON('/api/clear');
    inner.innerHTML = '';
    addMessage('bot', notes.filename
      ? 'New chat started. ' + notes.filename + ' is still loaded.'
      : WELCOME);
  });

  /* ---------- on page load: restore state from the server ---------- */
  (async function init() {
    try {
      const res = await fetch('/api/state');
      const data = await res.json();
      notes = { filename: data.filename, chars: data.chars, truncated: data.truncated };
      renderNotes();
      if (data.history && data.history.length) {
        data.history.forEach((m) => addMessage(m.role === 'user' ? 'user' : 'bot', m.content));
      } else {
        addMessage('bot', WELCOME);
      }
    } catch (e) {
      addMessage('bot', "Couldn't reach the server. Is app.py running?", { error: true });
    }
    input.focus();
  })();
</script>
</body>
</html>
